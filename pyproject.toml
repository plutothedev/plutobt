[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plutobt"
version = "2.0.1"
description = "Hybrid futures backtesting engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Cinnamon" }]
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "matplotlib==3.8.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "ruff==0.4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
